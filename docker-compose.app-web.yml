# app-web thin-client stack
#
# Important for browser login and CSRF/origin checks:
# - JOPLOCK_PUBLIC_BASE_URL is public URL for app-web users.
# - JOPLIN_SERVER_PUBLIC_URL is existing public Joplin Server URL.
# - Example:
#   JOPLOCK_PUBLIC_BASE_URL=https://joplock.021407.xyz
#   JOPLIN_SERVER_PUBLIC_URL=https://joplin.021407.xyz

services:
    db:
        image: postgres:16
        environment:
            - POSTGRES_PASSWORD=joplin
            - POSTGRES_USER=joplin
            - POSTGRES_DB=joplin
        volumes:
            - ./data/app-web-postgres:/var/lib/postgresql/data

    server:
        build:
            context: .
            dockerfile: Dockerfile.server
        depends_on:
            - db
        environment:
            - APP_PORT=22300
            - APP_BASE_URL=${JOPLIN_SERVER_PUBLIC_URL:-http://localhost:22300}
            - SIGNUP_ENABLED=${SIGNUP_ENABLED:-true}
            - DB_CLIENT=pg
            - POSTGRES_PASSWORD=joplin
            - POSTGRES_DATABASE=joplin
            - POSTGRES_USER=joplin
            - POSTGRES_PORT=5432
            - POSTGRES_HOST=db

    app-web:
        build:
            context: .
            dockerfile: packages/app-web/Dockerfile
        depends_on:
            - server
        ports:
            - '${APP_WEB_PORT:-5444}:3001'
        environment:
            - PORT=3001
            - JOPLIN_SERVER_ORIGIN=http://server:22300
            - JOPLIN_PUBLIC_BASE_PATH=${JOPLIN_PUBLIC_BASE_PATH:-}
            - JOPLIN_PUBLIC_BASE_URL=${JOPLOCK_PUBLIC_BASE_URL:-http://localhost:5444}
            - JOPLIN_SERVER_PUBLIC_URL=${JOPLIN_SERVER_PUBLIC_URL:-http://localhost:22300}
            - POSTGRES_PASSWORD=joplin
            - POSTGRES_DATABASE=joplin
            - POSTGRES_USER=joplin
            - POSTGRES_PORT=5432
            - POSTGRES_HOST=db
