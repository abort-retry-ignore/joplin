services:
    db:
        image: postgres:16
        ports:
            - '5432:5432'
        environment:
            - POSTGRES_PASSWORD=joplin
            - POSTGRES_USER=joplin
            - POSTGRES_DB=joplin
        volumes:
            - ./data/app-web-postgres:/var/lib/postgresql/data

    server:
        build:
            context: .
            dockerfile: Dockerfile.server
        depends_on:
            - db
        ports:
            - '22300:22300'
        environment:
            - APP_PORT=22300
            - APP_BASE_URL=http://localhost:22300
            - DB_CLIENT=pg
            - POSTGRES_PASSWORD=joplin
            - POSTGRES_DATABASE=joplin
            - POSTGRES_USER=joplin
            - POSTGRES_PORT=5432
            - POSTGRES_HOST=db

    app-web:
        build:
            context: .
            dockerfile: packages/app-web/Dockerfile
        depends_on:
            - server
        ports:
            - '3001:3001'
        environment:
            - PORT=3001
            - JOPLIN_SERVER_BASE_URL=http://localhost:22300
